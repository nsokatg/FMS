<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>収支概算予算確認アプリ</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 20px;
            background-color: #f8f9fa;
            color: #333;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .table-container {
            max-width: 100%;
            overflow-x: auto;
            background: #fff;
            border: 1px solid #dee2e6;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }
        th, td {
            border: 1px solid #dee2e6;
            padding: 8px 12px;
            text-align: left;
            font-size: 0.9rem;
        }
        th {
            background-color: #e9ecef;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        td input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 0.9rem;
            outline: none;
        }
        td input:focus {
            background: #fff;
            box-shadow: inset 0 0 0 2px #80bdff;
        }
        .loading {
            text-align: center;
            padding: 20px;
            font-size: 1.1rem;
            color: #6c757d;
        }
        .toolbar {
            margin-bottom: 15px;
        }
        button {
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>収支概算予算表</h1>
    
    <div class="toolbar">
        <button onclick="loadSpreadsheetData()">データを再読み込み</button>
    </div>

    <div class="table-container">
        <div id="loading" class="loading">データを読み込んでいます...</div>
        <table id="sheetTable" style="display: none;">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

<script>
    // ★ここに先ほどコピーしたGASのウェブアプリのURLを貼り付けてください
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycby0x78HWq-FWw98h3o2WgS_jukEJnoZR03N21OLKGXNrkzu4aoDzNqHaIMKTCcEanjw4Q/exec";

    // ページ読み込み時にスプレッドシートのデータを取得して表示
    window.onload = function() {
        loadSpreadsheetData();
    };

    async function loadSpreadsheetData() {
        const loadingEl = document.getElementById('loading');
        const tableEl = document.getElementById('sheetTable');
        
        loadingEl.style.display = 'block';
        tableEl.style.display = 'none';

        try {
            const response = await fetch(GAS_API_URL);
            const rows = await response.json();

            if (rows && rows.length > 0) {
                renderTable(rows);
                loadingEl.style.display = 'none';
                tableEl.style.display = 'table';
            } else {
                loadingEl.innerText = 'データがありません';
            }
        } catch (error) {
            console.error(error);
            loadingEl.innerText = 'データの読み込みに失敗しました。';
        }
    }

    function renderTable(rows) {
        const thead = document.getElementById('tableHead');
        const tbody = document.getElementById('tableBody');
        
        thead.innerHTML = '';
        tbody.innerHTML = '';

        // 1行目をヘッダー（費目、発生月、各月など）として描画
        const headerRow = document.createElement('tr');
        rows[0].forEach(cellText => {
            const th = document.createElement('th');
            th.innerText = cellText;
            headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);

        // 2行目以降をデータ行として描画
        for (let i = 1; i < rows.length; i++) {
            const tr = document.createElement('tr');
            rows[i].forEach((cellText, colIndex) => {
                const td = document.createElement('td');
                
                // 例として、入力フォーム（インプット）にしてブラウザ上でも書き換えられるようにする簡易実装
                const input = document.createElement('input');
                input.type = 'text';
                input.value = cellText !== null ? cellText : '';
                
                // 編集した時にどこを直したか保持させる（将来の保存処理用）
                input.dataset.row = i;
                input.dataset.col = colIndex;
                
                td.appendChild(input);
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        }
    }
</script>

</body>
</html>
