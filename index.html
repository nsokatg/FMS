<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>収支概算予算管理表</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 20px;
            background-color: #f8f9fa;
            color: #333;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .table-container {
            max-width: 100%;
            max-height: 80vh; /* 縦スクロールもさせたい場合の高さ制限 */
            overflow: auto;
            background: #fff;
            border: 1px solid #dee2e6;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        table {
            width: max-content; /* 表の幅を中身に合わせて自動調整（スクロール用） */
            border-collapse: collapse;
            white-space: nowrap;
        }
        th, td {
            border: 1px solid #dee2e6;
            padding: 8px 12px;
            text-align: left;
            font-size: 0.9rem;
            background-color: #fff;
        }
        /* ヘッダー全体の基本スタイル */
        th {
            background-color: #e9ecef;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        
        /* 列ごとの固定（Sticky）と幅の指定はJavaScriptから動的に付与します */

        td input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 0.9rem;
            outline: none;
        }
        td input:focus {
            background: #fff;
            box-shadow: inset 0 0 0 2px #80bdff;
        }
        .loading {
            text-align: center;
            padding: 20px;
            font-size: 1.1rem;
            color: #6c757d;
        }
        .toolbar {
            margin-bottom: 15px;
        }
        button {
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>収支概算予算管理表</h1>
    
    <div class="toolbar">
        <button onclick="loadSpreadsheetData()">データを再読み込み</button>
    </div>

    <div class="table-container">
        <div id="loading" class="loading">データを読み込んでいます...</div>
        <table id="sheetTable" style="display: none;">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

<script>
    // ★ここにGASのウェブアプリのURLを貼り付けてください
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycby0x78HWq-FWw98h3o2WgS_jukEJnoZR03N21OLKGXNrkzu4aoDzNqHaIMKTCcEanjw4Q/exec";

    // 各列の幅（ピクセル）の定義
    // 0列目: 費目, 1列目: 発生月, 2列目: 発生日, 3列目以降（年月など）: 一律120px
    const colWidths = [220, 120, 120]; 
    const defaultColWidth = 120;

    window.onload = function() {
        loadSpreadsheetData();
    };

    async function loadSpreadsheetData() {
        const loadingEl = document.getElementById('loading');
        const tableEl = document.getElementById('sheetTable');
        
        loadingEl.style.display = 'block';
        tableEl.style.display = 'none';

        try {
            const response = await fetch(GAS_API_URL);
            const rows = await response.json();

            if (rows && rows.length > 0) {
                renderTable(rows);
                loadingEl.style.display = 'none';
                tableEl.style.display = 'table';
            } else {
                loadingEl.innerText = 'データがありません';
            }
        } catch (error) {
            console.error(error);
            loadingEl.innerText = 'データの読み込みに失敗しました。';
        }
    }

    // 年月文字列を「YYYY年M月」形式に綺麗にフォーマットする関数
    function formatYearMonth(text) {
        if (!text) return '';
        // すでに「〇〇年〇〇月」の形であればそのまま返す
        if (text.toString().includes('年')) return text;

        // Dateオブジェクトや日付文字列の場合のパース
        let d = new Date(text);
        if (!isNaN(d.getTime())) {
            return `${d.getFullYear()}年${d.getMonth() + 1}月`;
        }

        // 「2026/1」や「2026-01」などの形式への簡易対応
        let match = text.toString().match(/^(\d{4})[\/\-](\d{1,2})$/);
        if (match) {
            return `${match[1]}年${parseInt(match[2], 10)}月`;
        }

        return text; // どれにも当てはまらない場合はそのまま
    }

    function renderTable(rows) {
        const thead = document.getElementById('tableHead');
        const tbody = document.getElementById('tableBody');
        
        thead.innerHTML = '';
        tbody.innerHTML = '';

        // 1. ヘッダー行の描画
        const headerRow = document.createElement('tr');
        rows[0].forEach((cellText, colIndex) => {
            const th = document.createElement('th');
            
            // 3列目（D列以降、インデックス3以上）の年月表示をフォーマット
            if (colIndex >= 3) {
                th.innerText = formatYearMonth(cellText);
            } else {
                th.innerText = cellText !== null ? cellText : '';
            }

            // 列幅とスクロール固定（左側3列）のスタイル適用
            applyCellStyles(th, colIndex, true);
            headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);

        // 2. データ行の描画
        for (let i = 1; i < rows.length; i++) {
            const tr = document.createElement('tr');
            rows[i].forEach((cellText, colIndex) => {
                const td = document.createElement('td');
                
                const input = document.createElement('input');
                input.type = 'text';
                input.value = cellText !== null ? cellText : '';
                
                input.dataset.row = i;
                input.dataset.col = colIndex;
                
                td.appendChild(input);
                
                // 列幅とスクロール固定（左側3列）のスタイル適用
                applyCellStyles(td, colIndex, false);
                
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        }
    }

    // セルに幅と、左側3列用の「横スクロール固定（sticky）」を設定する共通関数
    function applyCellStyles(element, colIndex, isHeader) {
        let width = colIndex < colWidths.length ? colWidths[colIndex] : defaultColWidth;
        element.style.width = `${width}px`;
        element.style.minWidth = `${width}px`;
        element.style.maxWidth = `${width}px`;

        // 左から0, 1, 2列目（費目・発生月・発生日）は左端に固定する
        if (colIndex < 3) {
            element.style.position = 'sticky';
            
            // 左からの累積距離を計算して配置
            let leftPos = 0;
            for (let c = 0; c < colIndex; c++) {
                leftPos += colWidths[c];
            }
            element.style.left = `${leftPos}px`;
            
            // スクロール時に下に潜り込む他のデータより手前に表示させるためのZindex
            element.style.zIndex = isHeader ? '3' : '2';
        }
    }
</script>

</body>
</html>
